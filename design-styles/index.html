const d = document.getElementById('d'), lb = d.querySelector('.lb'); let cur = 0;
const visible = () => [...document.querySelectorAll('.t:not([hidden])')].map(b => b.dataset.n);
function show(n) {
  const it = items.find(x => x.n === n); cur = n;
  lb.innerHTML = `<img src="img/card-${n}.webp" alt="${it.t} 카드">` + (it.ex ? `<div class="ex"><img src="img/ex-${n}.webp" alt="${it.t} 견본 그림"></div>` : '');
  if (!d.open) d.showModal();
}
function step(k) { const v = visible(), i = v.indexOf(cur); show(v[(i + k + v.length) % v.length]); }
document.querySelectorAll('.t').forEach(b => b.onclick = () => show(b.dataset.n));
d.querySelector('.x').onclick = () => d.close();
d.querySelector('.p').onclick = () => step(-1); d.querySelector('.n').onclick = () => step(1);
d.addEventListener('click', ev => { if (ev.target === d) d.close(); });
document.addEventListener('keydown', ev => { if (!d.open) return; if (ev.key === 'ArrowRight') step(1); if (ev.key === 'ArrowLeft') step(-1); });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.t').forEach(t => t.hidden = !!b.dataset.f && t.dataset.g !== b.dataset.f);
});
