<script>

const WORKS = [

const paperBg = p => `url(${C}${p})`;

let cur = 0;

/* 손으로 그린 듯한 동그라미 — 반지름을 흔든 닫힌 곡선 2바퀴 */
function scribblePath() {
  let d = ""; const cx = 150, cy = 110;
  for (let k = 0; k <= 54; k++) {
    const a = k / 40 * Math.PI * 2 - 1.2, rx = 136 + Math.sin(k * .9) * 4 + k * .3, ry = 98 + Math.cos(k * .7) * 3 - k * .15;
    d += (k ? "L" : "M") + (cx + Math.cos(a) * rx).toFixed(1) + " " + (cy + Math.sin(a) * ry).toFixed(1);
  }
  return d;
}
/* 몇 번째 = 오린 숫자 두 장 */
const numHtml = i => [...pad(i + 1)].map(ch => `<b style="background-image:${paperBg(pick(["paper-cream.jpg", "paper-kraft.jpg"]))}">${ch}</b>`).join("") + `<i>/ ${pad(N)}</i>`;

WORKS.forEach((w, i) => {
  const s = document.createElement("div");
  s.className = "slide"; s.setAttribute("role", "group"); s.setAttribute("aria-roledescription", "slide"); s.setAttribute("aria-label", `${i + 1} / ${N}: ${w.name}`);
  s.style.setProperty("--tilt", ((rnd() - .5) * 4).toFixed(2) + "deg"); s.style.setProperty("--tape-r", ((rnd() - .5) * 10).toFixed(1) + "deg");
  s.style.setProperty("--ink-c", w.ink);
  s.innerHTML = `<div class="num" aria-hidden="true">${numHtml(i)}</div>
    <div class="sheet" style="background-image:url(${C}card-${w.id}.webp)"></div>
    <img class="tape" src="${C}tape-${1 + (i % 2)}.png" alt="">
    <svg class="scribble" viewBox="0 0 300 220" preserveAspectRatio="none" aria-hidden="true"><path d="${scribblePath()}"/></svg>
    <div class="obj"><div class="float"><div class="boil" style="animation-delay:-${(rnd() * .5).toFixed(2)}s"><img src="${C}sticker-${w.id}.webp" alt=""></div></div></div>`;
  s.addEventListener("click", () => { if (moved) return; i === cur ? location.href = w.url : go(i); });
  track.appendChild(s);
  const d = document.createElement("button"); d.setAttribute("role", "tab"); d.setAttribute("aria-label", `${i + 1}번째 작품: ${w.name}`);
  d.addEventListener("click", () => go(i)); dots.appendChild(d);
});
const slides = [...track.children];

function rel(i) { let r = i - cur; if (r > N / 2) r -= N; if (r < -N / 2) r += N; return r; }
function burst() {
  if (reduce) return;
  const car = document.getElementById("carousel");
  for (let k = 0; k < 12; k++) {
    const b = document.createElement("div"); b.className = "bit";
    const ang = rnd() * Math.PI * 2, dist = 140 + rnd() * 220;
    b.style.cssText = `--s:${8 + rnd() * 16}px;--x:${(Math.cos(ang) * dist).toFixed(0)}px;--y:${(Math.sin(ang) * dist * .7 + 60).toFixed(0)}px;--rr:${(rnd() * 720 - 360).toFixed(0)}deg;background-image:${paperBg(pick(PAPERS))}`;
    car.appendChild(b); b.addEventListener("animationend", () => b.remove());
  }
}
function render(dir) {
  slides.forEach((s, i) => {
    const r = rel(i);
    s.className = "slide " + (r === 0 ? "is-active" : r === -1 ? "is-prev" : r === 1 ? "is-next" : r < 0 ? "is-far-prev" : "is-far-next");
    if (r === 0 && dir && !reduce) { void s.offsetWidth; s.classList.add("slap", dir > 0 ? "enter-r" : "enter-l"); }
  });
  [...dots.children].forEach((d, i) => d.setAttribute("aria-current", i === cur ? "true" : "false"));
  const w = WORKS[cur];
  document.getElementById("m-name").textContent = w.name;
  document.getElementById("m-line").textContent = w.line;
  document.getElementById("m-stage").textContent = w.stage;
  document.getElementById("m-open").href = w.url;
  if (dir) burst();
}
function go(i) { const dir = Math.sign(rel(i)) || 1; cur = (i + N) % N; render(dir); }
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
const car = document.getElementById("carousel");
car.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { go(cur + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft") { go(cur - 1); e.preventDefault(); }
  if (e.key === "Enter" && e.target === car) location.href = WORKS[cur].url;
});
let x0 = null, moved = false;
car.addEventListener("pointerdown", e => { x0 = e.clientX; moved = false; });
car.addEventListener("pointermove", e => { if (x0 !== null && Math.abs(e.clientX - x0) > 8) moved = true; });
car.addEventListener("pointerup", e => {
  if (x0 === null) return; const dx = e.clientX - x0; x0 = null;
  if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1));
  setTimeout(() => moved = false, 0);
});

/* 오린 글자 */
document.querySelectorAll("[data-ransom]").forEach(el => {
  const fonts = ['"Black Han Sans"', '"Noto Serif KR"', '"Pretendard"'];
  [...el.dataset.ransom].forEach(ch => {
    const sp = document.createElement("span"); sp.textContent = ch;
    const p = pick(PAPERS); sp.style.backgroundImage = paperBg(p);
    sp.style.color = /red|blue/.test(p) ? "#fff4e8" : "#1b1a17";
    sp.style.fontFamily = pick(fonts); sp.style.fontWeight = 900;
    sp.style.transform = `rotate(${((rnd() - .5) * 12).toFixed(1)}deg) translateY(${((rnd() - .5) * 6).toFixed(0)}px)`;
    el.appendChild(sp);
  });
});

/* 흩어진 종이 조각 */
const scraps = document.getElementById("scraps");
const tapeImgs = [C + "tape-1.png", C + "tape-2.png"];
for (let k = 0; k < 22; k++) {
  const el = document.createElement("div"); const kind = pick(["paper", "paper", "dots", "tape", "star", "squig"]);
  el.className = "scrap " + kind;
  const side = k % 2 ? rnd() * 22 : 78 + rnd() * 22;          // 가운데를 비우고 양옆에
  el.style.cssText = `left:${side.toFixed(1)}%;top:${(rnd() * 100).toFixed(1)}%;--r:${(rnd() * 70 - 35).toFixed(0)}deg;--d:${(8 + rnd() * 30).toFixed(0)};`;
  let inner = "";
  if (kind === "paper") {
    const w = 40 + rnd() * 90, h = 30 + rnd() * 70;
    const poly = Array.from({ length: 7 }, (_, j) => { const a = j / 7 * Math.PI * 2; return `${(50 + Math.cos(a) * (38 + rnd() * 12)).toFixed(0)}% ${(50 + Math.sin(a) * (38 + rnd() * 12)).toFixed(0)}%`; }).join(",");
    inner = `<div class="in" style="--w:${w.toFixed(0)}px;--h:${h.toFixed(0)}px;--t:${(5 + rnd() * 5).toFixed(1)}s;background-image:${paperBg(pick(PAPERS))};clip-path:polygon(${poly})"></div>`;
  } else if (kind === "dots") {
    inner = `<div class="in" style="--w:${(60 + rnd() * 80).toFixed(0)}px;--t:${(6 + rnd() * 4).toFixed(1)}s;--c:${pick(["#c0412a", "#4b4ad1", "#eee6d6", "#ffd84a"])}"></div>`;
  } else if (kind === "tape") {
    inner = `<img class="in" src="${pick(tapeImgs)}" alt="" style="--w:${(70 + rnd() * 60).toFixed(0)}px;--t:${(5 + rnd() * 5).toFixed(1)}s">`;
  } else if (kind === "star") {
    const c = pick(["#ffd84a", "#c0412a", "#eee6d6"]);
    inner = `<div class="in" style="--t:${(4 + rnd() * 4).toFixed(1)}s"><svg width="46" height="46" viewBox="-12 -12 24 24"><path d="M0-11 3-3 11 0 3 3 0 11-3 3-11 0-3-3Z" fill="${c}" stroke="#eee6d6" stroke-width="1.6"/></svg></div>`;
  } else {
    inner = `<div class="in" style="--t:${(5 + rnd() * 4).toFixed(1)}s"><svg width="110" height="40" viewBox="0 0 110 40"><path d="M4 30 C 20 4, 30 4, 40 22 S 62 38, 72 16 S 96 2, 106 20" fill="none" stroke="#ffd84a" stroke-width="3.5" stroke-linecap="round" opacity=".85"/></svg></div>`;
  }
  el.innerHTML = inner; scraps.appendChild(el);
}

/* 마우스 시차 */
if (!reduce) addEventListener("pointermove", e => {
  document.documentElement.style.setProperty("--mx", ((e.clientX / innerWidth) * 2 - 1).toFixed(3));
  document.documentElement.style.setProperty("--my", ((e.clientY / innerHeight) * 2 - 1).toFixed(3));
});

/* 첫 등장 — 조각이 하나씩 탁탁 붙는다 */
const pieces = [...document.querySelectorAll(".piece")];
pieces.forEach((p, k) => reduce ? p.classList.add("on") : setTimeout(() => p.classList.add("on"), 120 + k * 140));

const h = parseInt(location.hash.slice(1), 10); if (h >= 1 && h <= N) cur = h - 1;
render(0);
</script>
</body>
</html>
